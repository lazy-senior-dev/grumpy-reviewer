name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run check
      - name: Pack adapters
        run: |
          mkdir -p dist
          zip -qr "dist/grumpy-reviewer-adapters-${GITHUB_REF_NAME}.zip" \
            rules AGENTS.md GEMINI.md gemini-extension.json commands skills hooks \
            .claude-plugin .codex-plugin .agents .github/plugin .github/copilot-instructions.md \
            .devin-plugin .qoder-plugin .qoder .opencode .cursor .windsurf .clinerules .kiro .openclaw examples \
            LICENSE NOTICE README.md
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Install: see the README. Adapters for every supported host are attached as a zip for hosts that want a copy rather than a clone.
      - name: npm publish (only when NPM_TOKEN is set)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
