name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/check-adapters.mjs
      - run: node scripts/check-manifests.mjs
      - run: node scripts/check-attribution.mjs

  lint:
    name: actionlint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color
      - name: link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,204,206,429 --exclude-path node_modules --exclude 'https://github.com/lazy-senior-dev/grumpy-reviewer/(issues|discussions|releases|actions)' --exclude 'https://lazy-senior-dev.github.io' --exclude 'https://github.com/sponsors' README.md docs/agent-portability.md docs/RELATED.md
          fail: true

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
