  <text x="548" y="384" class="mono" font-size="20" fill="#e6e1d8">$ agent writes src/api/users.py</text>
  <text x="548" y="424" class="mono" font-size="20" font-weight="700" fill="#ff8a65">GRUMP: REQUEST_CHANGES</text>
  <text x="548" y="460" class="mono" font-size="17" fill="#e6e1d8">1. src/api/users.py:42 — user_id comes from the body,</text>
